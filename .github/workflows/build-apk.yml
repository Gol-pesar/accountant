name: Build Debug APK and Publish Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify Java environment
        shell: bash
        run: |
          set -euo pipefail
          echo "JAVA_HOME=${JAVA_HOME:-}"
          JAVA_VERSION_OUTPUT="$(java -version 2>&1)"
          echo "${JAVA_VERSION_OUTPUT}"

          RAW_VERSION="$(printf '%s\n' "${JAVA_VERSION_OUTPUT}" | sed -n 's/.*version "\([^"]*\)".*/\1/p' | head -n 1)"
          if [ -z "${RAW_VERSION}" ]; then
            echo "::error::Unable to detect the active Java version from 'java -version'."
            exit 1
          fi

          if [[ "${RAW_VERSION}" == 1.* ]]; then
            MAJOR_VERSION="$(printf '%s' "${RAW_VERSION}" | cut -d'.' -f2)"
          else
            MAJOR_VERSION="$(printf '%s' "${RAW_VERSION}" | cut -d'.' -f1 | cut -d'-' -f1 | cut -d'+' -f1)"
          fi

          if ! [[ "${MAJOR_VERSION}" =~ ^[0-9]+$ ]]; then
            echo "::error::Failed to parse Java major version from '${RAW_VERSION}'."
            exit 1
          fi

          echo "Detected Java major version: ${MAJOR_VERSION}"
          if [ "${MAJOR_VERSION}" -lt 17 ]; then
            echo "::error::Java 17 or newer is required, but detected Java ${MAJOR_VERSION} (${RAW_VERSION})."
            exit 1
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Configure signing keystore (persistent if secret provided)
        shell: bash
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          KEYSTORE_PATH="./debug.keystore"
          if [ -n "${DEBUG_KEYSTORE_BASE64:-}" ]; then
            echo "Restoring persistent keystore from DEBUG_KEYSTORE_BASE64 secret..."
            printf '%s' "${DEBUG_KEYSTORE_BASE64}" | base64 --decode > "${KEYSTORE_PATH}"
            echo "Persistent keystore restored — APK will update cleanly over previous versions."
          elif [ -f "${KEYSTORE_PATH}" ]; then
            echo "Keystore already exists at ${KEYSTORE_PATH}; reusing it."
          else
            echo "::warning::DEBUG_KEYSTORE_BASE64 secret is not set. Generating a temporary keystore (updates will require reinstalling unless you save a persistent keystore in GitHub Secrets)."
            KEYTOOL_BIN="${JAVA_HOME}/bin/keytool"
            if [ ! -x "${KEYTOOL_BIN}" ]; then
              echo "::error::keytool not found in configured Java 17 installation (${KEYTOOL_BIN})."
              exit 1
            fi
            "${KEYTOOL_BIN}" -genkeypair -v \
              -keystore "${KEYSTORE_PATH}" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=HesabdarMan,O=HesabdarMan,C=IR" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 >/dev/null 2>&1
          fi

          if [ ! -f "${KEYSTORE_PATH}" ] || [ ! -s "${KEYSTORE_PATH}" ]; then
            echo "::error::Keystore could not be prepared at ${KEYSTORE_PATH}."
            exit 1
          fi
          echo "Signing keystore is ready."

      - name: Build debug APK
        shell: bash
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -e "${EXPECTED_APK}" ]; then
            echo "::error::Expected debug APK not found at ${EXPECTED_APK}."
            if [ -d "app/build/outputs/apk" ]; then
              echo "APK files discovered inside app/build/outputs/apk:"
              find app/build/outputs/apk -type f -name '*.apk' || true
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            exit 1
          fi

          if [ ! -f "${EXPECTED_APK}" ]; then
            echo "::error::${EXPECTED_APK} is not a regular file."
            exit 1
          fi

          if [ ! -s "${EXPECTED_APK}" ]; then
            echo "::error::${EXPECTED_APK} is empty."
            exit 1
          fi

          if [[ "${EXPECTED_APK}" != *.apk ]]; then
            echo "::error::${EXPECTED_APK} does not have the .apk extension."
            exit 1
          fi

          echo "Verified debug APK: ${EXPECTED_APK} ($(stat -c%s "${EXPECTED_APK}") bytes)"

      - name: Upload debug APK artifact
        id: upload_apk_artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_release_asset
        shell: bash
        env:
          REPO_FULL_NAME: ${{ github.repository }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          SOURCE_APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "${SOURCE_APK}" ] || [ ! -s "${SOURCE_APK}" ]; then
            echo "::error::Verified debug APK is missing or empty at ${SOURCE_APK}."
            exit 1
          fi

          RAW_REPO_NAME="${REPO_FULL_NAME#*/}"
          SAFE_REPO_NAME="$(printf '%s' "${RAW_REPO_NAME}" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9._-]+/-/g; s/^-+//; s/-+$//')"
          if [ -z "${SAFE_REPO_NAME}" ]; then
            SAFE_REPO_NAME="android-app"
          fi

          RELEASE_ASSET_DIR="$(mktemp -d "${RUNNER_TEMP}/apk-release-XXXXXX")"
          ASSET_FILENAME="${SAFE_REPO_NAME}-debug-build-${RUN_NUMBER}.apk"
          ASSET_PATH="${RELEASE_ASSET_DIR}/${ASSET_FILENAME}"

          cp -- "${SOURCE_APK}" "${ASSET_PATH}"

          if [ ! -f "${ASSET_PATH}" ] || [ ! -s "${ASSET_PATH}" ] || [[ "${ASSET_PATH}" != *.apk ]]; then
            echo "::error::Failed to prepare release APK asset at ${ASSET_PATH}."
            exit 1
          fi

          {
            echo "asset_path=${ASSET_PATH}"
            echo "asset_filename=${ASSET_FILENAME}"
          } >> "${GITHUB_OUTPUT}"

          echo "Prepared release APK asset: ${ASSET_FILENAME}"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET_PATH: ${{ steps.prepare_release_asset.outputs.asset_path }}
          ASSET_FILENAME: ${{ steps.prepare_release_asset.outputs.asset_filename }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          RELEASE_TAG="debug-apk-build-${RUN_NUMBER}-${RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${RUN_NUMBER}"

          {
            echo "release_tag=${RELEASE_TAG}"
            echo "release_title=${RELEASE_TITLE}"
          } >> "${GITHUB_OUTPUT}"

          if ! command -v gh >/dev/null 2>&1; then
            echo "::warning::GitHub CLI (gh) is not available on this runner."
            exit 1
          fi
          gh --version

          if [ -z "${ASSET_PATH}" ] || [ ! -f "${ASSET_PATH}" ] || [ ! -s "${ASSET_PATH}" ] || [[ "${ASSET_PATH}" != *.apk ]]; then
            echo "::warning::Prepared release APK asset validation failed; aborting GitHub Release creation."
            exit 1
          fi

          RELEASE_NOTES="$(cat <<EOF
          This is an automatically generated debug APK built by GitHub Actions.

          - **GitHub Actions Run Number:** ${RUN_NUMBER}
          - **GitHub Actions Run Attempt:** ${RUN_ATTEMPT}
          - **Source Commit SHA:** \`${COMMIT_SHA}\`
          - **APK Asset:** \`${ASSET_FILENAME}\`

          ### Important Notice
          - This APK is intended for testing purposes only.
          - This APK is **not** a Google Play Store production release.
          - This APK is signed only with a temporary debug keystore generated during the CI build.
          EOF
          )"

          gh release create "${RELEASE_TAG}" "${ASSET_PATH}" \
            --title "${RELEASE_TITLE}" \
            --notes "${RELEASE_NOTES}" \
            --target "${COMMIT_SHA}" \
            --latest

      - name: Report APK download result
        if: ${{ always() && (steps.publish_release.outcome == 'success' || steps.publish_release.outcome == 'failure') }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_OUTCOME: ${{ steps.publish_release.outcome }}
          RELEASE_TAG: ${{ steps.publish_release.outputs.release_tag }}
          RELEASE_TITLE: ${{ steps.publish_release.outputs.release_title }}
          ASSET_FILENAME: ${{ steps.prepare_release_asset.outputs.asset_filename }}
        run: |
          set -euo pipefail
          if [ "${RELEASE_OUTCOME}" = "success" ]; then
            RELEASE_URL="$(gh release view "${RELEASE_TAG}" --json url --jq '.url' || true)"
            if [ -z "${RELEASE_URL}" ]; then
              echo "::warning::Release was created, but its URL could not be retrieved via gh release view."
              {
                echo "## Debug APK Build Summary"
                echo ""
                echo "- **APK Build:** Succeeded"
                echo "- **GitHub Actions Artifact:** \`app-debug-apk\` is available for download."
                echo "- **GitHub Release:** Verification could not retrieve the release URL."
              } >> "${GITHUB_STEP_SUMMARY}"
              exit 0
            fi

            echo "Release Tag: ${RELEASE_TAG}"
            echo "Release Title: ${RELEASE_TITLE}"
            echo "Release URL: ${RELEASE_URL}"
            echo "APK Asset Filename: ${ASSET_FILENAME}"

            {
              echo "## Debug APK Build & Release Summary"
              echo ""
              echo "- **Release Tag:** \`${RELEASE_TAG}\`"
              echo "- **Release Title:** ${RELEASE_TITLE}"
              echo "- **APK Asset Filename:** \`${ASSET_FILENAME}\`"
              echo "- **GitHub Release Page:** [Download APK from Release](${RELEASE_URL})"
              echo ""
              echo "You can download \`${ASSET_FILENAME}\` directly from the **Assets** section on the GitHub Release page."
              echo ""
              echo "The normal GitHub Actions artifact (\`app-debug-apk\`) is also available on this workflow run as a backup."
            } >> "${GITHUB_STEP_SUMMARY}"
          else
            echo "::warning::Publishing to GitHub Releases failed. The debug APK build succeeded and the GitHub Actions artifact 'app-debug-apk' remains available for download."
            {
              echo "## Debug APK Build Summary"
              echo ""
              echo "> **Warning:** Publishing to GitHub Releases failed."
              echo ""
              echo "- **APK Build:** Succeeded"
              echo "- **Backup Download:** The GitHub Actions artifact named \`app-debug-apk\` was uploaded successfully and remains available for download from this workflow run."
            } >> "${GITHUB_STEP_SUMMARY}"
          fi
